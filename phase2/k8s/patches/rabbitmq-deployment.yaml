# rabbitmq/deployment.yaml — Phase 2 patch: adds Prometheus metrics plugin.
#
# WHAT CHANGED FROM PHASE 1:
#   1. Added volume mount for rabbitmq-plugins ConfigMap (enables rabbitmq_prometheus)
#   2. Added port 15692 (Prometheus metrics endpoint)
#   3. Added RABBITMQ_PLUGINS_DIR env var pointing to mounted config
#
# This file is applied with kubectl apply — same Deployment name + namespace as
# Phase 1, so it performs an in-place update (rolling restart). Phase 1 files
# on disk remain untouched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: inference-system
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: inference-lab
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: inference-lab
        app.kubernetes.io/component: messaging
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values:
                      - cpu

      # NEW: mount the plugins ConfigMap as a volume
      volumes:
        - name: rabbitmq-plugins
          configMap:
            name: rabbitmq-plugins
            # WHY ConfigMap volume: mounts the enabled_plugins file into the
            # container filesystem. RabbitMQ reads this on startup to decide
            # which plugins to activate.

      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management

          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            # NEW: Prometheus metrics port — where Prometheus scrapes queue metrics
            - name: prometheus
              containerPort: 15692
              # WHY :15692: this is the default port for rabbitmq_prometheus plugin.
              # It exposes metrics in Prometheus text exposition format at /metrics.
              # Separate from the management port (:15672) to avoid overloading
              # the management API with high-frequency scrapes.

          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "inference"
            - name: RABBITMQ_DEFAULT_PASS
              value: "inference123"

          # NEW: mount the enabled_plugins file
          volumeMounts:
            - name: rabbitmq-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
              # WHY subPath: mounts only the single file, not the entire directory.
              # Without subPath, the ConfigMap volume would replace the entire
              # /etc/rabbitmq/ directory, overwriting rabbitmq.conf and other defaults.

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
