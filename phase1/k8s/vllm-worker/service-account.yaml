# vllm-worker/service-account.yaml — Identity for vLLM pods to access AWS services.
#
# WHY IRSA (IAM Roles for Service Accounts):
#   Traditional approach: embed AWS credentials as env vars or mount a credentials file.
#   Problem: credentials are long-lived, hard to rotate, and visible to anyone
#   who can describe the pod.
#
#   IRSA approach: the ServiceAccount is annotated with an IAM role ARN.
#   When the pod starts, the EKS OIDC provider issues a short-lived JWT token
#   that the AWS SDK exchanges for temporary STS credentials. No static keys.
#
# ANALOGY: IRSA is to Kubernetes what EC2 Instance Profiles are to EC2.
#   - ServiceAccount ≈ Instance Profile
#   - IAM Role annotation ≈ IAM Role attached to the profile
#   - OIDC token exchange ≈ Instance Metadata Service (IMDS)
#   - Result: pods get temporary credentials automatically, just like EC2 instances do.
#
# REQUIRED IAM PERMISSIONS for the role:
#   - s3:GetObject, s3:PutObject, s3:ListBucket on the model cache bucket
#     (for reading/writing cached model weights)
#   - ecr:GetAuthorizationToken, ecr:BatchGetImage (for pulling container images,
#     though the node role usually handles this)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-worker
  namespace: inference-system
  labels:
    app.kubernetes.io/name: vllm-worker
    app.kubernetes.io/part-of: inference-lab
    app.kubernetes.io/component: inference
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::019167255542:role/inference-lab-vllm-worker"
    # PLACEHOLDER: replace 019167255542 with your AWS account ID.
    # This role must have:
    #   1. A trust policy allowing the EKS OIDC provider to assume it
    #   2. S3 read/write permissions for the model cache bucket
    #
    # The deploy script will create this role and update this annotation.
    # Trust policy condition restricts assumption to this specific SA:
    #   "StringEquals": {
    #     "oidc.eks.us-east-1.amazonaws.com/id/CLUSTER_ID:sub":
    #       "system:serviceaccount:inference-system:vllm-worker"
    #   }
