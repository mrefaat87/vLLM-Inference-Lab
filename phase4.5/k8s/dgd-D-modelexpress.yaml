# Experiment D — ModelExpress vs Phase 4.1 streamer (cold-start probe)
#
# Variable changed from A: weight-load method only.
#
# This DGD is the **ModelExpress arm**. The streamer arm is a separate plain
# vLLM Deployment defined in k8s/exp-D-streamer-deploy.yaml (or, simpler, a
# vanilla `vllm/vllm-openai` Deployment per Phase 4.1 config E — the 212s winner).
#
# Workload: W4 only (single cold-start probe per arm, ≥3 trials each).
#
# Run sequence:
#   1. Deploy this DGD with ModelExpress arm — record cold start ≥3 times
#   2. Deploy Phase 4.1 streamer plain Deployment — record cold start ≥3 times
#   3. Compare time-to-ready (pod created → first successful inference)
#
# NOTE: ModelExpress server is a separate component shipped with Dynamo
# (`/tmp/dynamo-v102/components/src/dynamo/modelexpress/` per Dynamo source).
# If ModelExpress isn't trivially deployable in one pass, halt and document —
# don't burn a day debugging a side-experiment.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: exp-d-modelexpress
  namespace: dynamo-system
  labels:
    phase: phase4-5
    experiment: D
    variable: weight-load-method
spec:
  services:
    Frontend:
      componentType: main
      replicas: 1
      livenessProbe:
        httpGet: { path: /health, port: 8000 }
        initialDelaySeconds: 20
        periodSeconds: 5
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'curl -s http://localhost:8000/health | jq -e ".status == \"healthy\""'
        initialDelaySeconds: 60
        periodSeconds: 60
      resources:
        requests: { cpu: "1", memory: "2Gi" }
        limits:   { cpu: "4", memory: "8Gi" }
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.2
          workingDir: /workspace/examples/backends/vllm
          command: ["/bin/sh", "-c"]
          args:
            - "python3 -m dynamo.frontend --http-port 8000"

    VllmDecodeWorker:
      componentType: worker
      replicas: 1   # cold-start probe; single worker is enough
      livenessProbe:
        httpGet: { path: /live, port: 9090 }
        periodSeconds: 5
      readinessProbe:
        httpGet: { path: /health, port: 9090 }
        periodSeconds: 10
        failureThreshold: 60
      resources:
        # Sized for g4dn.xlarge (4 vCPU, 16 GiB, 1 T4)
        requests: { cpu: "2", memory: "8Gi", gpu: "1" }
        limits:   { cpu: "3", memory: "12Gi", gpu: "1" }
      envs:
        - { name: DYN_SYSTEM_PORT, value: "9090" }
        - { name: DYN_SYSTEM_USE_ENDPOINT_HEALTH_STATUS, value: '["generate"]' }
        # ModelExpress endpoint — populated when MX server is deployed.
        # See k8s/modelexpress/ for server manifest (TBD authored at Stage 10).
        - { name: MODEL_EXPRESS_URL, value: "http://modelexpress.dynamo-system.svc.cluster.local:8080" }
      extraPodSpec:
        tolerations:
          - { key: nvidia.com/gpu, operator: Equal, value: "true", effect: NoSchedule }
        mainContainer:
          startupProbe:
            httpGet: { path: /health, port: 9090 }
            periodSeconds: 10
            failureThreshold: 90
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.2
          workingDir: /workspace/examples/backends/vllm
          command: ["/bin/sh", "-c"]
          args:
            # NOTE: the exact ModelExpress integration flag will be confirmed at
            # Stage 10 against current Dynamo docs. The `--load-format` flag
            # accepts `runai_streamer` and similar; ModelExpress may register a
            # custom value here (e.g., `model_express`) or use an env var pattern.
            - >
              python3 -m dynamo.vllm
              --model Qwen/Qwen2.5-7B-Instruct-AWQ
              --quantization awq
              --max-model-len 4096
              --gpu-memory-utilization 0.9
              2>&1 | tee /tmp/vllm.log
