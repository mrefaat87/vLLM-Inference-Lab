# gpu-nodepool-prebaked-warmed.yaml — Karpenter NodePool for variant F.
#
# DESIGN INTENT (DIFFERS FROM gpu-nodepool-prebaked.yaml):
#   - amiSelectorTerms targets Variant=prebaked-stock-warmed (set by
#     gpu-node-stock-warmed.pkr.hcl). Distinct from variant D's prebaked-stock
#     so the two NodePools don't both pull the same AMI.
#   - Adds label image-source: prebaked-warmed so baseline-pod-prebaked-warmed.yaml
#     lands here and not on variant D's NodePool.
#   - Everything else (g4dn.xlarge / Spot / us-east-1a / GPU taint / 6h expireAfter)
#     matches variant D exactly so the hardware fingerprint is identical.
#
# WHY ISOLATION FROM VARIANTS C/D MATTERS:
#   F's pod manifest mounts hostPath /opt/vllm-cache (the JIT compile cache baked
#   into the warmed AMI). If a variant-F pod accidentally landed on a variant-C/D
#   node, the hostPath wouldn't exist, the pod would fail to start, AND the
#   experiment would be invalid because we'd be measuring whatever node it landed on.
#   Distinct image-source label + Karpenter's tag-based AMI selection enforces this.
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: gpu-nodes-prebaked-warmed
  labels:
    app.kubernetes.io/part-of: inference-phase4-1
spec:
  amiFamily: AL2

  # Target the warmed AMI specifically.
  amiSelectorTerms:
    - tags:
        Project: inference-lab
        Stage: phase4.1
        Variant: prebaked-stock-warmed

  role: "inference-phase4-1-karpenter-node"

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "inference-phase4-1"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "inference-phase4-1"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: inference-lab
    Stage: phase4.1
    NodePool: prebaked-warmed
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-pool-prebaked-warmed
  labels:
    app.kubernetes.io/part-of: inference-phase4-1
spec:
  template:
    metadata:
      labels:
        node-role: gpu
        image-source: prebaked-warmed
    spec:
      nodeClassRef:
        name: gpu-nodes-prebaked-warmed

      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g4dn.xlarge

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot

        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-1a

        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

  limits:
    cpu: "8"
    memory: 32Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 300s
    expireAfter: 6h
    budgets:
      - nodes: "1"
