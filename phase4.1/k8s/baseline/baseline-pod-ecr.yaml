# baseline-pod-ecr.yaml — Variant B of the 3-way pull comparison.
#
# DELTA FROM baseline-pod.yaml:
#   - image: swapped from vllm/vllm-openai:v0.19.0 (Docker Hub) to the ECR mirror
#     at 019167…/inference-lab/vllm-openai:v0.19.0-stock. Bytes are identical
#     (digest verified by push-stock-to-ecr.sh).
#   - imagePullPolicy: kept as Always — we WANT a fresh pull on every cold start
#     to measure ECR's pull latency. Otherwise containerd would short-circuit on
#     a node that happened to have the image cached.
#   - Everything else unchanged: same model, same init container, same probes,
#     same resource requests, same tracer ConfigMap. The image SOURCE is the
#     only variable.
#
# Lands on the SAME default NodePool (gpu-pool, stock EKS GPU AMI) as variant A —
# only the registry the pull goes to differs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: baseline-runner
  namespace: baseline
  annotations:
    eks.amazonaws.com/role-arn: ROLE_ARN_PLACEHOLDER
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cold-start-tracer
  namespace: baseline
data:
  cold_start_tracer.py: |
    PLACEHOLDER_TRACER_SCRIPT
---
apiVersion: v1
kind: Pod
metadata:
  name: baseline-RUN_ID
  namespace: baseline
  labels:
    app: baseline
    run-id: "RUN_ID"
    image-source: ecr-same-region  # Used by run_pull_comparison.py to assert correct variant landed.
  annotations:
    karpenter.sh/do-not-disrupt: "true"
spec:
  serviceAccountName: baseline-runner
  restartPolicy: Never

  # Same node TYPE as variant A (default EKS GPU AMI), explicitly routed
  # via image-source=default-eks. Without the explicit label, Karpenter
  # could schedule onto the prebaked NodePool (also labeled node-role=gpu)
  # nondeterministically — first run of this experiment hit that bug and
  # all 9 runs landed on prebaked nodes, contaminating the data.
  nodeSelector:
    node-role: gpu
    image-source: default-eks

  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

  initContainers:
    - name: model-download
      image: public.ecr.aws/aws-cli/aws-cli:2.17.18
      command:
        - sh
        - -c
        - |
          set -euxo pipefail
          mkdir -p /models/Qwen2.5-7B-Instruct-AWQ
          aws s3 cp --recursive --no-progress \
            s3://inference-lab-model-cache/Qwen/Qwen2.5-7B-Instruct-AWQ/ \
            /models/Qwen2.5-7B-Instruct-AWQ/
      volumeMounts:
        - name: model-cache
          mountPath: /models

  containers:
    - name: vllm
      # ─── THE ONLY MEANINGFUL CHANGE FROM baseline-pod.yaml ─────────────────
      # Uses the EXISTING v0.19.0 ECR tag — verified 2026-05-01 to be
      # byte-identical to vllm/vllm-openai:v0.19.0 amd64 on Docker Hub
      # (manifest digest sha256:7a0f0fdd…). No re-push needed.
      image: 019167255542.dkr.ecr.us-east-1.amazonaws.com/inference-lab/vllm-openai:v0.19.0
      # Always — force fresh pull from ECR for every cold-start run.
      imagePullPolicy: Always

      command:
        - python3
        - /tracer/cold_start_tracer.py
        - --run-id=RUN_ID
        - --jsonl-dir=/var/log/cold_start
        - --
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --model=/models/Qwen2.5-7B-Instruct-AWQ
        - --quantization=awq
        - --dtype=half
        - --gpu-memory-utilization=0.85
        - --max-model-len=4096
        - --host=0.0.0.0
        - --port=8000

      ports:
        - containerPort: 8000
          name: http

      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 120
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6

      resources:
        requests:
          nvidia.com/gpu: 1
          cpu: "2"
          memory: 12Gi
        limits:
          nvidia.com/gpu: 1
          cpu: "4"
          memory: 14Gi

      volumeMounts:
        - name: model-cache
          mountPath: /models
          readOnly: true
        - name: tracer-script
          mountPath: /tracer
          readOnly: true
        - name: tracer-logs
          mountPath: /var/log/cold_start

  volumes:
    - name: model-cache
      emptyDir:
        sizeLimit: 8Gi
    - name: tracer-script
      configMap:
        name: cold-start-tracer
        defaultMode: 0755
    - name: tracer-logs
      hostPath:
        path: /var/log/cold_start
        type: DirectoryOrCreate
