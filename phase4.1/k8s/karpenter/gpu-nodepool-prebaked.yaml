# gpu-nodepool-prebaked.yaml — Karpenter NodePool for variant C of the pull comparison.
#
# DESIGN INTENT (DIFFERS FROM gpu-nodepool.yaml):
#   - amiSelectorTerms targets the AMI tag set by gpu-node-stock.pkr.hcl
#     (Variant=prebaked-stock). The default NodePool falls back to the latest
#     EKS-optimized AL2 GPU AMI; this one pins to our pre-baked AMI specifically.
#   - Adds label image-source: prebaked-stock so baseline-pod-prebaked.yaml's
#     nodeSelector lands its pod here (and not on the default gpu-pool).
#   - Same g4dn.xlarge / Spot / single-AZ constraints as the default pool to
#     preserve hardware-fingerprint stability across A/B/C runs.
#
# ISOLATION FROM THE DEFAULT NODEPOOL:
#   Both NodePools coexist during the comparison run. They differ on:
#     1. AMI (default = stock EKS GPU; this one = pre-baked stock vLLM)
#     2. Node label (default = node-role: gpu; this one = node-role: gpu +
#        image-source: prebaked-stock)
#   Pods select via labels. There's no scheduling conflict — variant A and B
#   pods (no image-source selector) land on default; variant C pods (with
#   image-source=prebaked-stock) land here.
#
# AZ SELECTION:
#   pick_az.py from the existing harness writes the chosen AZ into the default
#   NodePool. run_pull_comparison.py copies that decision into this NodePool's
#   topology.kubernetes.io/zone requirement so all 9 runs share the same AZ.
#
# RUNTIME EXPECTATION:
#   When a pod with nodeSelector image-source=prebaked-stock is scheduled,
#   Karpenter provisions a g4dn.xlarge from this NodePool. The instance launches
#   from the pre-baked AMI; containerd already has the vLLM image registered.
#   Pod startup skips the network image pull entirely — but pays the EBS
#   S3-lazy-load tax on first read of the layer files (see LEARNINGS.md).
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: gpu-nodes-prebaked
  labels:
    app.kubernetes.io/part-of: inference-phase4-1
spec:
  amiFamily: AL2

  # ─── THE KEY DIFFERENCE: target the pre-baked AMI, not the default EKS one ───
  # gpu-node-stock.pkr.hcl tags the produced AMI with Variant=prebaked-stock.
  # If multiple AMIs match (re-builds), Karpenter picks the most recent.
  amiSelectorTerms:
    - tags:
        Project: inference-lab
        Stage: phase4.1
        Variant: prebaked-stock

  role: "inference-phase4-1-karpenter-node"

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "inference-phase4-1"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "inference-phase4-1"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: inference-lab
    Stage: phase4.1
    NodePool: prebaked
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-pool-prebaked
  labels:
    app.kubernetes.io/part-of: inference-phase4-1
spec:
  template:
    metadata:
      labels:
        # Both labels are required by baseline-pod-prebaked.yaml's nodeSelector.
        node-role: gpu
        image-source: prebaked-stock
    spec:
      nodeClassRef:
        name: gpu-nodes-prebaked

      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g4dn.xlarge

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot

        # AZ pinned to us-east-1a — matches the default pool (also pinned to 1a)
        # and the AMI build (also AZ 1a). All 9 runs of the comparison must land
        # in the same AZ for the hardware fingerprint to remain invariant.
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-1a

        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64

      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

  limits:
    cpu: "8"
    memory: 32Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 300s
    expireAfter: 6h
    budgets:
      - nodes: "1"
